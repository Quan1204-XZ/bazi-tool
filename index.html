  /* ---------- 历史存档 ---------- */
  var HISTORY_KEY = 'baziHistory_v1';

  function readHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function writeHistory(arr) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr)); return true; }
    catch (e) { return false; }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function archiveGz(ent) {
    var s = ent.mode === 'lunar' ? C.lunar2solar(ent.y, ent.m, ent.d, !!ent.leap) : null;
    var p = s ? C.paiPan(s.y, s.m, s.d, ent.hour, ent.min, ent.boundary || 'wan') : C.paiPan(ent.y, ent.m, ent.d, ent.hour, ent.min, ent.boundary || 'wan');
    return [p.year, p.month, p.day, p.hour].map(function (x) { return C.GAN[x.gan] + C.ZHI[x.zhi]; }).join(' ');
  }

  function renderArchive() {
    var list = readHistory();
    var box = el('archiveList');
    if (!list.length) {
      box.innerHTML = '<div class="arc-empty">暂无存档，排盘后点「保存存档」即可记录，下次打开仍可载入。</div>';
      return;
    }
    var html = '';
    var copy = list.slice().reverse();
    for (var i = 0; i < copy.length; i++) {
      var ent = copy[i];
      var gz = '';
      try { gz = archiveGz(ent); } catch (e) {}
      var dateTxt = (ent.mode === 'lunar' ? '农历 ' + ent.y + '-' + ent.m + '-' + ent.d + (ent.leap ? '(闰)' : '') : '公历 ' + ent.y + '-' + ('0' + ent.m).slice(-2) + '-' + ('0' + ent.d).slice(-2)) +
        ' ' + ('0' + ent.hour).slice(-2) + ':' + ('0' + ent.min).slice(-2) +
        ' · ' + (ent.gender === 'female' ? '女' : '男') +
        (gz ? ' · ' + gz : '');
      html += '<div class="arc-item" data-id="' + ent.id + '">' +
        '<div class="arc-info"><div class="arc-name">' + escapeHtml(ent.name || '未命名') + '</div>' +
        '<div class="arc-sub">' + escapeHtml(dateTxt) + '</div></div>' +
        '<div class="arc-actions">' +
          '<button type="button" class="arc-btn load" data-act="load">载入</button>' +
          '<button type="button" class="arc-btn del" data-act="del">删除</button>' +
        '</div>' +
      '</div>';
    }
    box.innerHTML = html;
  }

  function saveEntry(name) {
    var y = +fYear.value, m = +fMonth.value, d = +fDay.value;
    var hour = +fHour.value, min = Math.max(0, Math.min(59, Math.round(+fMin.value || 0)));
    var cityIdx = +fCity.value || 0;
    var cityLon = cityIdx === CUSTOM_IDX ? (isFinite(+fLon.value) ? +fLon.value : 120) : CITIES[cityIdx].lon;
    var list = readHistory();
    // 同名覆盖更新，便于修正后重存
    for (var i = 0; i < list.length; i++) {
      if (list[i].name === name) { list.splice(i, 1); break; }
    }
    list.push({
      id: Date.now(), name: name, mode: mode, y: y, m: m, d: d, leap: fLeap.checked,
      hour: hour, min: min, gender: fGender.value, boundary: fBoundary.value,
      city: cityIdx, cityLon: cityLon,
      savedAt: new Date().toISOString()
    });
    if (list.length > 60) list = list.slice(list.length - 60);
    var ok = writeHistory(list);
    el('savePanel').classList.add('hidden');
    renderArchive();
    return ok;
  }

  function loadEntry(ent) {
    setMode(ent.mode === 'lunar' ? 'lunar' : 'solar');
    fYear.value = ent.y;
    fMonth.value = ent.m;
    fLeap.checked = !!ent.leap;
    fGender.value = ent.gender === 'female' ? 'female' : 'male';
    fHour.value = ent.hour;
    fMin.value = ent.min;
    fBoundary.value = ent.boundary === 'zao' ? 'zao' : 'wan';
    if (ent.city != null) {
      fCity.value = ent.city;
      if (ent.cityLon) fLon.value = ent.cityLon;
      updateCityTip();
    }
    updateLeapField();
    fDay.value = ent.d;
    render();
  }

  el('btnSave').addEventListener('click', function () {
    var y = +fYear.value, m = +fMonth.value, d = +fDay.value;
    var valid = mode === 'solar'
      ? (d >= 1 && d <= C.solarDays(y, m))
      : (d >= 1 && d <= (fLeap.checked ? C.leapDays(y) : C.monthDays(y, m)));
    if (!valid) { err.textContent = '当前日期无效，无法存档'; err.classList.add('show'); return; }
    err.classList.remove('show');
    el('saveName').value = '';
    el('savePanel').classList.remove('hidden');
    el('saveName').focus();
  });
  el('saveOk').addEventListener('click', function () {
    var name = (el('saveName').value || '').trim() || ('公历 ' + fYear.value + '-' + fMonth.value + '-' + fDay.value);
    saveEntry(name);
  });
  el('saveCancel').addEventListener('click', function () { el('savePanel').classList.add('hidden'); });
  el('saveName').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('saveOk').click(); });

  el('archiveList').addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;
    var item = btn.closest('.arc-item');
    if (!item) return;
    var id = Number(item.getAttribute('data-id'));
    var list = readHistory();
    var ent = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) ent = list[i];
    if (!ent) return;
    if (btn.getAttribute('data-act') === 'load') {
      loadEntry(ent);
    } else if (btn.getAttribute('data-act') === 'del') {
      if (confirm('确定删除存档「' + (ent.name || '未命名') + '」？')) {
        for (var j = 0; j < list.length; j++) if (list[j].id === id) { list.splice(j, 1); break; }
        writeHistory(list);
        renderArchive();
      }
    }
  });

  /* ---------- 分享：URL 参数（打开即排盘） ---------- */
  function loadFromURL() {
    var params = new URLSearchParams(location.search);
    if (!params.has('y')) return false;
    var y = parseInt(params.get('y'), 10), m = parseInt(params.get('m'), 10), d = parseInt(params.get('d'), 10);
    if (!isFinite(y) || !isFinite(m) || !isFinite(d)) return false;
    fYear.value = y; fMonth.value = m; fDay.value = d;
    fHour.value = parseInt(params.get('h'), 10) || 0;
    fMin.value = parseInt(params.get('min'), 10) || 0;
    fGender.value = params.get('g') === 'female' ? 'female' : 'male';
    fBoundary.value = params.get('b') === 'zao' ? 'zao' : 'wan';
    if (params.has('city')) {
      var ci = parseInt(params.get('city'), 10);
      if (isFinite(ci) && ci >= 0 && ci < CITIES.length) fCity.value = ci;
      if (params.has('lon')) fLon.value = params.get('lon');
      updateCityTip();
    }
    updateLeapField();
    fillDays();
    render();
    return true;
  }

      var tx = document.createElement('textarea');
      tx.value = t; document.body.appendChild(tx); tx.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(tx);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(function () { fallback(url); done(); });
    } else { fallback(url); done(); }
  });

    + '#pdfReport p.sum{font-weight:700;margin-top:16px;font-size:14px;}'
    + '#pdfReport p.det{color:#444;font-size:13px;line-height:1.9;margin-bottom:18px;}'
    + '#pdfReport .foot{text-align:center;font-size:11px;color:#999;margin-top:26px;}'
    + '#pdfReport .pfoot{position:absolute;left:58px;right:58px;bottom:26px;text-align:center;font-size:11px;color:#999;padding-top:6px;border-top:1px solid #eee;}';

  function buildPdfReport() {
    var old = document.getElementById('pdfReport');
    if (old) old.parentNode.removeChild(old);
    var wrap = document.createElement('div');
    wrap.id = 'pdfReport';
    var styleEl = document.createElement('style');
    styleEl.textContent = PDF_CSS;
    wrap.appendChild(styleEl);
    document.body.appendChild(wrap);

    var today = new Date();
    var dateTxt = today.getFullYear() + ' 年 ' + (today.getMonth() + 1) + ' 月 ' + today.getDate() + ' 日';
    var genderTxt = fGender.value === 'male' ? '男' : '女';
    var secs = [];

    secs.push({ html: '<h1>八字排盘报告</h1><div class="sub">' + dateTxt + ' · ' + genderTxt + '命 · 由八字排盘工具生成</div>', nb: false });

    var infoRows = '';
    var ks = document.querySelectorAll('#infoGrid .k'), vs = document.querySelectorAll('#infoGrid .v');
    for (var i = 0; i < ks.length && i < vs.length; i++) {
      infoRows += '<tr><td class="k2">' + ks[i].textContent + '</td><td>' + vs[i].textContent + '</td></tr>';
    }
    if (infoRows) secs.push({ html: '<h2>一、基本信息</h2><table>' + infoRows + '</table>', nb: false });

    var pilRows = '';
    document.querySelectorAll('#pillars .pillar').forEach(function (p) {
      var name = (p.querySelector('.p-name') || {}).textContent || '';
      var gz = (p.querySelector('.p-gz') || {}).innerText || '';
      var cang = (p.querySelector('.cang') || {}).textContent || '';
      var meta = (p.querySelector('.meta') || {}).innerText || '';
      var ss = (p.querySelector('.p-shensha') || {}).textContent || '';
      pilRows += '<tr><td class="k2">' + name + '</td><td><b>' + gz.replace(/\n+/g, ' ').trim() + '</b><br>' +
        cang + '<br>' + meta.replace(/\n+/g, ' · ') + '<br>' + ss + '</td></tr>';
    });
    if (pilRows) secs.push({ html: '<h2>二、四柱排盘</h2><table>' + pilRows + '</table>', nb: true });

    var core = document.getElementById('coreStrip');
    if (core && core.innerText.trim()) {
      secs.push({ html: '<h2>三、命局核心</h2><p class="sum">' + core.innerText.replace(/\n+/g, ' · ') + '</p>', nb: true });
    }

    var repItems = document.querySelectorAll('#reportList .report-item');
    if (repItems.length) {
      secs.push({ html: '<h2>四、分析报告</h2>', nb: true });
      repItems.forEach(function (it, idx) {
        var t = (it.querySelector('.report-title') || {}).textContent || '';
        var s = (it.querySelector('.report-summary') || {}).textContent || '';
        var clone = it.cloneNode(true);
        var detEl = clone.querySelector('.report-detail');
        if (detEl) detEl.classList.remove('hidden');
        var d = detEl ? detEl.innerText : '';
        d = d.replace(/\s+/g, ' ').trim().slice(0, 600);
        secs.push({ html: '<p class="sum">' + (idx + 1) + '. ' + t + '：' + s + '</p>' + (d ? '<p class="det">' + d + '</p>' : ''), nb: false });
      });
    }

    var stars = document.getElementById('starsGrid');
    if (stars && stars.innerText.trim()) {
      secs.push({ html: '<h2>五、格局星评</h2><p class="sum">' + stars.innerText.replace(/\n+/g, ' · ') + '</p>', nb: true });
    }
    secs.push({ html: '<div class="foot">本报告由八字排盘工具按规则自动推演（用神、格局、十神关系等），仅供参考，不构成命理结论。</div>', nb: false });

    var page = document.createElement('div');
    page.className = 'pdf-page';
    for (var s = 0; s < secs.length; s++) {
      var item = document.createElement('div');
      item.innerHTML = secs[s].html;
      if (secs[s].nb && page.children.length) {
        wrap.appendChild(page);
        page = document.createElement('div');
        page.className = 'pdf-page';
      }
      page.appendChild(item);
      while (page.offsetHeight > 990 && page.children.length > 1) {
        var last = page.lastChild;
        page.removeChild(last);
        wrap.appendChild(page);
        page = document.createElement('div');
        page.className = 'pdf-page';
        page.appendChild(last);
      }
    }
    if (page.children.length) wrap.appendChild(page);
    var pgs = wrap.querySelectorAll('.pdf-page');
    for (var pi = 0; pi < pgs.length; pi++) {
      var pf = document.createElement('div');
      pf.className = 'pfoot';
      pf.textContent = '第 ' + (pi + 1) + '/' + pgs.length + ' 页 · 生成日期 ' + dateTxt + ' · 由八字排盘工具生成';
      pgs[pi].appendChild(pf);
    }
    return wrap;
  }
  window.__buildPdfReport = buildPdfReport;

  function exportPdf() {
    if (!window.html2canvas || !(window.jspdf && window.jspdf.jsPDF)) {
      alert('PDF 组件未加载（需联网加载 CDN 库），请联网后重试');
      return;
    }
    var result = el('result');
    if (result.classList.contains('hidden')) { alert('请先开盘生成排盘结果'); return; }
    var box = el('pdfProgress'), bar = el('pdfBar'), pct = el('pdfPct');
    box.classList.remove('hidden');
    pct.textContent = '5%'; bar.style.width = '5%';
    var name = (el('saveName').value || '').trim();
    var today = new Date();
    var ymd = today.getFullYear() + ('0' + (today.getMonth() + 1)).slice(-2) + ('0' + today.getDate()).slice(-2);
    var dateTxt = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
    var fileName = '八字报告' + (name ? '_' + name : '') + '_' + ymd + '.pdf';
    var wrap = buildPdfReport();
    var pages = wrap.querySelectorAll('.pdf-page');
    var pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
    var pi = 0;
    function renderPage() {
      if (pi >= pages.length) {
        pdf.save(fileName);
        pct.textContent = '100%'; bar.style.width = '100%';
        setTimeout(function () { box.classList.add('hidden'); }, 500);
        return;
      }
      pct.textContent = Math.round(10 + pi / pages.length * 80) + '%';
      bar.style.width = pct.textContent;
      html2canvas(pages[pi], { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false })
        .then(function (canvas) {
          if (pi > 0) pdf.addPage();
          var img = canvas.toDataURL('image/jpeg', 0.92);
          var w = 210, h = 210 * canvas.height / canvas.width;
          if (h > 297) { h = 297; w = 297 * canvas.width / canvas.height; }
          pdf.addImage(img, 'JPEG', (210 - w) / 2, (297 - h) / 2, w, h, undefined, 'FAST');
          pi++;
          renderPage();
        })
        .catch(function (e) {
          box.classList.add('hidden');
          alert('PDF 生成失败：' + (e && e.message ? e.message : e));
        });
    }
    renderPage();
  }
  el('btnPdf').addEventListener('click', exportPdf);

  renderArchive();
  try {
    if (!loadFromURL()) render();
  } catch (e) {
    render();
  }
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</body>
